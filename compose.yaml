services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/app/data
      - chroma_data:/app/rag/chroma_db
      - model_cache:/home/autodiag/.cache/huggingface
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      AUTODIAG_DOMAIN: ${AUTODIAG_DOMAIN:?Set AUTODIAG_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_data:
  chroma_data:
  model_cache:
  caddy_data:
  caddy_config:
